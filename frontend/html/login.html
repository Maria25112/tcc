<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        #caixaCadastro{
            display: none;
        }
    </style>
</head> 
<body>
    <!-- CAIXA DE LOGIN -->
<div id="caixaLogin">
    <h2>M . L . A</h2>
    <h1>Login</h1>
        <form id="formLogin">
            <input type="email" id="emailLogin" placeholder="Email" required>
            <input type="password" id="senhaLogin" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    <p id="mensagemLogin"></p>
    <p>Não tem uma conta? <a href="#" id="linkIrCadastro">Cadastre-se aqui</a></p>
    </div>
 
    <div id="caixaCadastro">
        <h2>M . L . A</h2>
        <h1>Cadastrar novo usuário</h1>
        <form id="formCadastro">
            <input type="text" id="nomeCadastro" placeholder="Nome" required>
            <input type="email" id="emailCadastro" placeholder="Email" required>
            <input type="password" id="senhaCadastro" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="mensagemCadastro"></p>
 
        <a href="#" id="linkIrLogin">Clique aqui para fazer login</a>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
